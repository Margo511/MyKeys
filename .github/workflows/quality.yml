name: Quality

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  expo-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run doctor
      - run: npm run verify:bundle

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: mobile/**/*.gradle*
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - working-directory: mobile
        run: ./gradlew :androidApp:assembleDebug :shared:testAndroidHostTest :androidApp:lintDebug
      - run: npm run scan:android-config

  supabase-local:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - run: npm ci
      - run: npm run supabase:start
      - run: npm run supabase:test
      - run: npm run supabase:lint
      - run: npm run supabase:test:auth
